name: Release binaries

on:
  push:
    branches:
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused tests
        run: cargo test --no-default-features
      - name: Build
        run: cargo build --release
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/mobilization-sort.exe dist/mobilization-sort-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/mobilization-sort-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/stage
          cp target/${{ matrix.target }}/release/mobilization-sort dist/stage/mobilization-sort
          tar -C dist/stage -czf dist/mobilization-sort-macos-${{ matrix.target }}.tar.gz mobilization-sort
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/mobilization-sort-macos-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS.txt
      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
