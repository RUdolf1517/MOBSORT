[package]
name = "mobilization-sort"
version = "0.1.3"
edition = "2021"
description = "A humorous terminal visualizer for Partial Mobilization Sort"
license = "MIT"
repository = "https://github.com/RUdolf1517/MOBSORT"
default-run = "mobilization-sort"

[features]
default = ["audio"]
audio = ["dep:cpal"]

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
rand = "0.8"
cpal = { version = "0.15", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
